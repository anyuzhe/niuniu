[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab-research"
version = "0.1.0"
description = "Unified technical factor research core"
requires-python = ">=3.11"
dependencies = ["polars>=1.0,<2", "pyarrow>=15", "duckdb>=1.0,<2"]

[project.optional-dependencies]
desktop = ["PyQt6>=6.7,<7"]
market_data = ["baostock==0.9.3"]
vnpy = ["vnpy==4.4.0", "alphalens-reloaded==0.4.6"]
mcp = ["mcp>=2,<3"]

[project.scripts]
quantlab = "quantlab.cli:main"
niuniu-mcp = "quantlab.agent.mcp_server:main"
niuniu-tracking-daemon = "quantlab.agent.tracking_daemon:main"
niuniu-playbook-forward = "quantlab.agent.playbook_forward_cli:main"
niuniu-market-snapshot = "quantlab.agent.market_snapshot_cli:main"
niuniu-market-provider-status = "quantlab.agent.market_snapshot_provider_cli:main"
niuniu-market-snapshot-live = "quantlab.agent.market_snapshot_live_cli:main"
niuniu-pit-evidence = "quantlab.agent.pit_evidence_cli:main"
niuniu-pit-universe = "quantlab.agent.pit_universe_cli:main"
niuniu-pit-coverage = "quantlab.agent.pit_coverage_cli:main"
niuniu-security-status = "quantlab.agent.security_status_cli:main"
niuniu-security-status-coverage = "quantlab.agent.security_status_coverage_cli:main"
niuniu-daily-playbook-scan = "quantlab.agent.playbook_scan_cli:main"
niuniu-prep-playbook-scan = "quantlab.agent.prep_scan_cli:main"
niuniu-daily-market = "quantlab.agent.daily_market_cli:main"
niuniu-retro-daily = "quantlab.agent.retro_daily_cli:main"
niuniu-limit-events = "quantlab.agent.limit_events_cli:main"
niuniu-daily-orchestrator = "quantlab.agent.daily_orchestrator_cli:main"
niuniu-playbook-decision-bridge = "quantlab.agent.playbook_decision_bridge_cli:main"
niuniu-playbook-paper-plan = "quantlab.agent.playbook_paper_plan_cli:main"
niuniu-paper-fill-intent = "quantlab.agent.paper_fill_intent_cli:main"
niuniu-paper-review = "quantlab.agent.paper_review_cli:main"
niuniu-paper-lifecycle = "quantlab.agent.paper_lifecycle_cli:main"
niuniu-agent-scorecard = "quantlab.agent.scorecard_cli:main"
niuniu-dev-studio = "quantlab.agent.dev_studio_cli:main"
niuniu-system-health = "quantlab.agent.system_health_cli:main"
niuniu-mobile-brief = "quantlab.agent.mobile_brief_cli:main"
niuniu-broker-shadow = "quantlab.agent.broker_shadow_cli:main"
niuniu-real-trade-readiness = "quantlab.agent.real_trade_readiness_cli:main"
niuniu-research-session-grant = "quantlab.agent.research_session_grant_cli:main"
niuniu-paper-rebalance = "quantlab.agent.paper_rebalance_cli:main"
niuniu-paper-rebalance-outcome = "quantlab.agent.paper_rebalance_outcome_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quantlab.factors" = ["alpha_expressions.json", "ALPHA_PROVENANCE.md", "ALPHA_LICENSE"]
"quantlab._vendor.chanpy" = ["LICENSE", "PROVENANCE.json"]
"quantlab.desktop" = ["assets/*.png"]
"quantlab.workbench" = ["static/*.html", "static/*.css", "static/*.js", "static/assets/*.png"]
