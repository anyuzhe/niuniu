# nginx 配置片段 — 加到 /www/wwwroot/nb-q7m3.aiiiiai.com 的 server 块
# 转发 /api/trade/ 到 Windows 电脑上的 trade_status_api.py
#
# 在宝塔面板 → 网站 → 设置 → 配置文件，找到 server { } 块，
# 在其中加入以下 location：

location /api/trade/ {
    proxy_pass http://127.0.0.1:8800;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

# 同时在 deploy_mobile.py 的 CSP 中把 connect-src 加上 'self'
# （'self' 已包含同域 /api/ 路径，无需额外修改 CSP）
